# Baut bei jedem Versions-Tag (z. B. v2.1.0) die App und den Installer
# und veröffentlicht beides als GitHub Release. Die App findet das Update dann selbst.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: NSIS installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Version bestimmen
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: App bauen
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.AppVersion=${{ steps.v.outputs.version }} -X main.UpdateRepo=${{ github.repository }}" \
            -o dist/PicoDashboard.exe .

      - name: Installer bauen
        working-directory: installer
        run: makensis -V2 -DVERSION=${{ steps.v.outputs.version }} setup.nsi

      - name: Prüfsumme
        working-directory: dist
        run: sha256sum PicoDashboard-Setup.exe > SHA256SUMS.txt

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=""
          if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then NOTES="--notes-file release-notes/${GITHUB_REF_NAME}.md"; else NOTES="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" dist/PicoDashboard-Setup.exe dist/SHA256SUMS.txt \
            --title "Pico Dashboard ${{ steps.v.outputs.version }}" $NOTES
